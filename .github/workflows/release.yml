name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create venv and install backend deps
        shell: pwsh
        run: |
          python -m venv backend/venv
          backend/venv/Scripts/python.exe -m pip install --upgrade pip
          backend/venv/Scripts/python.exe -m pip install -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build exe
        working-directory: ./
        shell: pwsh
        run: ./build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: JobFit.exe
          path: dist/JobFit.exe

      - name: Publish release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $title = "JobFit $tag - 智能简历定制平台"
          $notes = @"
          ## JobFit $tag

          基于大模型的智能简历定制平台（Windows 单文件版）。

          ### 使用说明
          - 双击 JobFit.exe 启动，自动打开浏览器（端口 8000 起自动探测）
          - 数据存于 %APPDATA%\JobFit\jobfit.db
          - 首次启动需解压（数秒），杀毒软件可能误报，请添加信任
          - 包体约 180MB，含 OCR 模型，无需安装 Python/Node
          "@
          if (gh release view $tag --json tagName 2>$null) {
            gh release upload $tag dist/JobFit.exe --clobber
          } else {
            gh release create $tag dist/JobFit.exe --title $title --notes $notes
          }
